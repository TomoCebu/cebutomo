<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CebuTomo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#28b6cc">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>CebuTomoEnglish</title>
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@latest/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<style>
  :root{
    --sky:#8fe0f2; --sea:#28b6cc; --sea2:#1a93b4; --sand:#fce6c0; --sand2:#f7d9a8;
    --coral:#ff7a63; --coral2:#f2593c; --palm:#1fa98a; --teal:#0fb5b0;
    --ink:#0c3a46; --muted:#5a8494; --card:rgba(255,255,255,.74);
    --line:rgba(12,58,70,.14); --shadow:0 10px 30px rgba(12,58,70,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    color:var(--ink); line-height:1.65; min-height:100vh;
    background:linear-gradient(180deg,#a9e8f7 0%,#7ad6ea 22%,#38bcd0 48%,#2bb0c6 66%,#f7d9a8 100%);
    background-attachment:fixed;
  }
  /* 装飾（太陽・波・ヤシ） */
  .decor{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .sun{position:absolute;top:-60px;right:-40px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,#fff3c4 0%,#ffe38a 45%,rgba(255,227,138,0) 72%);opacity:.85}
  .wave{position:fixed;left:0;right:0;bottom:0;width:100%;height:120px;opacity:.5}
  .palm{position:fixed;bottom:0;font-size:90px;opacity:.22;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
  .palm.l{left:-6px} .palm.r{right:-6px;transform:scaleX(-1)}
  .wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:16px 16px 40px}
  header{display:flex;align-items:center;gap:10px;justify-content:flex-start;padding:16px 4px 14px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--teal),var(--coral));
    display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 16px rgba(242,89,60,.3);
    transform:rotate(-6deg)}
  .brand .name{font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1.05;
    background:linear-gradient(95deg,#0d6e5a 0%,#0fb5b0 42%,#f2593c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 1px 0 rgba(255,255,255,.25)}
  .brand .sub{font-size:11px;color:var(--muted);font-weight:700;margin-top:1px;letter-spacing:.02em}
  .pbtns{display:flex;gap:2px;flex-wrap:wrap}
  .pbtns .speak{background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:20px;padding:4px 9px;font-size:12px}
  .pbtns .speak.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .listen{color:var(--muted);font-size:13px;font-weight:600;padding:2px 0}
  .fb.pron h4{color:var(--coral2)}
  .scrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .scl{flex:0 0 62px;font-size:13px;font-weight:700}
  .scbar{flex:1;height:10px;background:rgba(12,58,70,.1);border-radius:6px;overflow:hidden}
  .scfill{display:block;height:100%;border-radius:6px;transition:width .5s}
  .scv{flex:0 0 32px;text-align:right;font-weight:800;font-size:14px}
  .weak{margin-top:10px;font-size:13px}
  .wchip{display:inline-block;background:#ffe0d8;color:#c23a1f;border-radius:20px;padding:2px 9px;margin:2px;font-weight:700;font-size:12px}
  .card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.6);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  input,select,textarea{width:100%;background:rgba(255,255,255,.85);border:1px solid var(--line);color:var(--ink);
    border-radius:14px;padding:13px 14px;font-size:16px;font-family:inherit;outline:none}
  input:focus,select,textarea:focus{border-color:var(--teal)}
  textarea{resize:vertical;min-height:64px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>div{flex:1;min-width:150px}
  button{cursor:pointer;border:none;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700;
    font-family:inherit;transition:.15s;color:#fff;min-height:48px}
  .btn-primary{background:linear-gradient(135deg,var(--coral),var(--coral2));box-shadow:0 6px 16px rgba(242,89,60,.32)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-mic{background:linear-gradient(135deg,var(--teal),var(--sea2));box-shadow:0 6px 16px rgba(15,181,176,.3);font-size:18px}
  .btn-mic.rec{background:linear-gradient(135deg,#ff6f61,#e23e2a);animation:pulse 1.2s infinite}
  .btn-ghost{background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--ink)}
  .btn-sm{padding:9px 13px;font-size:14px;min-height:40px}
  button:disabled{opacity:.5;cursor:not-allowed}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,62,42,.5)}50%{box-shadow:0 0 0 12px rgba(226,62,42,0)}}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  .msg{border-radius:18px;padding:13px 15px;margin-bottom:12px}
  /* 相手=海（アクア） */
  .msg.partner{background:linear-gradient(135deg,rgba(143,224,242,.55),rgba(255,255,255,.72));
    border:1px solid rgba(40,182,204,.45);border-left:4px solid var(--sea)}
  .msg.partner .who{color:var(--sea2)}
  /* 自分=サンゴ（コーラル） */
  .msg.user{background:linear-gradient(135deg,rgba(255,180,150,.34),rgba(255,150,120,.2));
    border:1px solid rgba(242,89,60,.38);border-left:4px solid var(--coral);margin-left:18px}
  .msg.user .who{color:var(--coral2)}
  .msg .who{font-size:12px;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
  .msg .en{font-size:17px}
  .msg .ja{font-size:13px;color:var(--muted);margin-top:4px}
  .direction{background:rgba(255,241,214,.85);border-left:4px solid var(--coral);padding:11px 13px;
    border-radius:12px;font-size:14px;margin-bottom:12px;font-weight:600}
  /* システム/コーチ=砂（サンド） */
  .fb{background:linear-gradient(135deg,rgba(255,244,224,.94),rgba(255,249,238,.9));
    border:1px solid rgba(247,201,120,.55);border-left:4px solid var(--sand2);border-radius:16px;
    padding:15px;margin:2px 0 14px 18px;box-shadow:var(--shadow)}
  .card.sys{background:linear-gradient(135deg,rgba(255,244,224,.94),rgba(255,249,238,.9));
    border:1px solid rgba(247,201,120,.55);border-left:4px solid var(--sand2)}
  .fb h4{margin:0 0 11px;font-size:13px;color:var(--palm);letter-spacing:.04em}
  .fb .item{margin-bottom:10px;font-size:14px}
  .fb .item:last-child{margin-bottom:0}
  .fb .k{font-weight:800;color:var(--ink)}
  .fb .native{background:rgba(31,169,138,.1);border:1px solid rgba(31,169,138,.28);border-radius:12px;padding:10px 12px}
  .fb .native .en{font-size:15px;color:#0d6e5a;font-weight:600}
  .speak{background:none;border:none;color:var(--sea2);cursor:pointer;font-size:14px;padding:3px 6px;font-weight:700}
  .loading{color:var(--muted);font-size:14px;padding:8px 2px;display:flex;align-items:center;gap:9px;font-weight:600}
  .spinner{width:16px;height:16px;border:3px solid rgba(12,58,70,.15);border-top-color:var(--teal);
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
  .foot{font-size:12px;color:rgba(12,58,70,.6);text-align:center;padding:8px 0 20px}
  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;margin-left:6px;font-weight:700}
  .badge.ok{background:#c9f2df;color:#0c7a54} .badge.no{background:#ffd6cf;color:#c23a1f}
  .badge.mid{background:#ffedc2;color:#a9721a}
  .live{background:rgba(255,255,255,.8);border:2px dashed rgba(12,58,70,.2);border-radius:16px;
    padding:16px;min-height:58px;font-size:16px;color:var(--ink);font-weight:500}
  .live.rec{border-color:var(--coral);border-style:solid;background:rgba(255,241,236,.9)}
  .live .ph{color:var(--muted);font-weight:500}
  .chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin:0;cursor:pointer;font-weight:600}
  .chk input{width:auto;min-height:auto}
  .keyrow{margin-bottom:12px}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .preset{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:rgba(255,255,255,.85);border:1px solid var(--line);color:var(--ink);font-size:24px;
    border-radius:16px;padding:14px 8px;min-height:76px;box-shadow:0 3px 10px rgba(12,58,70,.08)}
  .preset span{font-size:13px;font-weight:800}
  .preset:active{transform:translateY(1px)}
  .preset:hover{border-color:var(--teal);background:#fff}
  .sumlist{margin:6px 0 0;padding-left:20px}
  .sumlist li{margin-bottom:10px}
  .good-note{background:rgba(31,169,138,.12);border:1px solid rgba(31,169,138,.28);border-radius:12px;padding:10px 12px;font-size:14px}
  .drill{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .dw{font-size:20px;font-weight:900;color:var(--ink);margin-bottom:8px}
  .drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dresult{margin-top:10px}
  .wchip.pick{cursor:pointer} .wchip.pick:hover{background:#ffcdbf}
</style>
</head>
<body>
<div class="decor">
  <div class="sun"></div>
  <div class="palm l">🌴</div><div class="palm r">🌴</div>
  <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none"><path fill="#ffffff" d="M0,64 C240,110 480,10 720,48 C960,86 1200,20 1440,60 L1440,120 L0,120 Z"/></svg>
</div>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">🌴</div>
      <div>
        <div class="name">CebuTomoEnglish</div>
        <div class="sub">🎙 旅行英会話トレーナー</div>
      </div>
    </div>
  </header>

  <!-- 設定 -->
  <div class="card">
    <details id="settingsBox" open>
      <summary>⚙️ 設定（初回のみ）</summary>
      <div style="margin-top:14px">
        <div class="keyrow">
          <label>Anthropic APIキー（Claude・会話と添削用）</label>
          <input type="password" id="apiKey" placeholder="sk-ant-api03-...">
        </div>
        <div class="keyrow">
          <label>OpenAI APIキー（Whisper・音声の文字起こし用）</label>
          <input type="password" id="openaiKey" placeholder="sk-...">
        </div>
        <div class="row keyrow">
          <div style="flex:2 1 60%">
            <label>Azure Speechキー（発音採点用・任意）</label>
            <input type="password" id="azureKey" placeholder="発音を採点したい場合のみ">
          </div>
          <div style="flex:1 1 30%">
            <label>Azureリージョン</label>
            <input type="text" id="azureRegion" placeholder="例: japaneast">
          </div>
        </div>
        <div class="keyrow">
          <label>認識を強化したい単語（名前・地名など／カンマ区切り）</label>
          <input type="text" id="phrases" placeholder="例: Inomata, Tomo, Cebu">
        </div>
        <div class="row">
          <div>
            <label>会話・添削モデル</label>
            <select id="model">
              <option value="claude-haiku-4-5-20251001">Haiku 4.5（安い・速い）</option>
              <option value="claude-sonnet-5" selected>Sonnet 5（高品質）</option>
            </select>
          </div>
          <div>
            <label>相手の話す速さ</label>
            <select id="rate">
              <option value="0.8">ゆっくり</option>
              <option value="0.95" selected>ふつう</option>
              <option value="1.1">はやめ</option>
            </select>
          </div>
        </div>
        <div class="hint">💾 キーは各端末のブラウザ内にだけ保存され、外部には送られません（OpenAI/Anthropicへの通信を除く）。</div>
      </div>
    </details>
  </div>

  <!-- シチュエーション -->
  <div class="card" id="setupCard">
    <label>場面を選んでタップ</label>
    <div class="presets">
      <button class="preset" data-sit="空港のチェックインカウンターで、航空会社の係員と搭乗手続きをする（預け荷物・座席・搭乗ゲートなど）">✈️<span>空港チェックイン</span></button>
      <button class="preset" data-sit="リゾートホテルのフロントでチェックインする（予約確認・部屋・朝食の時間・Wi-Fiなど）">🏨<span>ホテルチェックイン</span></button>
      <button class="preset" data-sit="レストランに入店し、店員と人数や席についてやり取りして案内してもらう">🍽️<span>レストラン入店</span></button>
      <button class="preset" data-sit="カフェに入り、店員におすすめを聞いてドリンクやフードを注文する">☕<span>カフェ入店</span></button>
      <button class="preset" data-sit="旅行先で出会った現地の友達と、日常的な雑談をする">🧑‍🤝‍🧑<span>友達と日常会話</span></button>
      <button class="preset" data-sit="お土産屋さんで店員に商品について尋ねたり値段を聞いたりして買い物する">🎁<span>お土産屋さん</span></button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
      <label style="margin:0">その他（自由に入力）</label>
      <button class="btn-ghost btn-sm" id="sitMic" type="button">🎤 音声で入力</button>
    </div>
    <textarea id="situation" placeholder="例）ビーチでマリンアクティビティを予約したい"></textarea>
    <button class="btn-primary" id="startBtn" style="width:100%;margin-top:10px">▶ 入力した場面で始める</button>
    <button class="btn-ghost" id="practiceBtn" style="width:100%;margin-top:8px">🗣 単語だけ発音練習する</button>
    <div class="hint">💡 開始後、話しかけられたら「🎤 話す」を押して英語で話し、終わったら「⏹」を押します。</div>
  </div>
  <div id="practiceHome"></div>

  <!-- 会話 -->
  <div id="convo"></div>

  <!-- 入力 -->
  <div class="card hidden" id="inputCard">
    <div style="margin-bottom:12px"><button class="btn-ghost btn-sm" id="hintBtn">💡 ヒントを見る</button></div>
    <div class="direction hidden" id="direction"></div>
    <div id="liveBox" class="live"><span class="ph">🟢 準備ができたら「🎤 話す」を押してください</span></div>
    <div class="row" style="margin-top:12px">
      <div style="flex:1 1 100%"><button class="btn-mic" id="micBtn" style="width:100%">🎤 話す</button></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div style="flex:0 0 auto"><button class="btn-ghost btn-sm" id="redoBtn">🔄 話し直す</button></div>
      <div style="flex:0 0 auto"><button class="btn-ghost btn-sm" id="editBtn">✏️ 手入力</button></div>
      <div style="flex:0 0 auto"><button class="btn-ghost btn-sm" id="endBtn">会話を終える</button></div>
    </div>
    <textarea id="answer" class="hidden" style="margin-top:12px" placeholder="英語で入力してください..."></textarea>
    <button class="btn-primary hidden" id="sendBtn" style="margin-top:10px;width:100%">送信して添削 →</button>
    <div class="hint" id="micHint"></div>
  </div>

  <div class="foot">🌺 ローカル完結アプリ / 会話=Claude, 文字起こし=Whisper</div>
</div>

<script>
const $ = id => document.getElementById(id);
const SYSTEM = `あなたは日本人の中級英語学習者のための「旅行英会話」練習パートナーです。
ユーザーは練習したい場面を日本語で入力します。あなたはその場面の相手役（現地の友達・カフェやホテルの従業員など）を演じます。
必ず reply ツールを使って応答してください。
- partner_line: 相手役の自然な英語のセリフ（中級者に伝わる範囲）
- partner_line_ja: その日本語訳
- direction_ja: ユーザーが次に英語で言うべき事の短い日本語ヒント
- feedback: 直前のユーザー英語発話の添削。会話の最初のターン（ユーザーがまだ話していない時）だけ省略し、それ以外は必ず全項目を埋める（空文字禁止）。①通じたか(comprehensible) ②文法(grammar) ③発音(pronunciation：入力はWhisperで文字起こしされた英語なので、綴りや語形から日本人がつまずきやすい音(th,r/l,v/b等)を推定して助言) ④より自然な言い方(native) を日本語で簡潔に、しかし必ず具体的に記述する。
- done: 会話を4〜6ラリー続けたら true にして締める。
【重要】ユーザーの入力は英語の発話をWhisperで文字起こししたテキストです。たとえ入力が不完全・崩れている・一部日本語・意味が取りにくくても、決して「英語で話してください」等と会話を止めないこと。必ず相手役として自然に会話を続け、気づいた点はfeedbackで指摘する。英語として不明瞭な場合は最も近い意図を推測して応答し、その旨をpronunciationやcomprehensibleで日本語で優しく伝える。
励ましながら簡潔に。`;

let messages = [];
let keepGoing = false;   // 「続ける」で会話を延長
let sessionWeakWords = [];   // 会話全体で発音が弱かった単語

// ---- 設定の保存/復元 ----
(function restore(){
  const g=(k,el)=>{ const v=localStorage.getItem(k); if(v!=null) $(el).value=v; };
  g('te_key','apiKey'); g('te_okey','openaiKey'); g('te_model','model'); g('te_rate','rate');
  g('te_azkey','azureKey'); g('te_azreg','azureRegion'); g('te_phrases','phrases');
  if(localStorage.getItem('te_key')) $('settingsBox').open=false;
})();
$('apiKey').addEventListener('change',e=>localStorage.setItem('te_key',e.target.value.trim()));
$('openaiKey').addEventListener('change',e=>localStorage.setItem('te_okey',e.target.value.trim()));
$('azureKey').addEventListener('change',e=>localStorage.setItem('te_azkey',e.target.value.trim()));
$('azureRegion').addEventListener('change',e=>localStorage.setItem('te_azreg',e.target.value.trim()));
$('phrases').addEventListener('change',e=>localStorage.setItem('te_phrases',e.target.value.trim()));
function phraseList(){ return ($('phrases').value||'').split(',').map(s=>s.trim()).filter(Boolean); }
$('model').addEventListener('change',e=>localStorage.setItem('te_model',e.target.value));
$('rate').addEventListener('change',e=>localStorage.setItem('te_rate',e.target.value));

document.querySelectorAll('.preset').forEach(b=>{ b.onclick=()=>startConversation(b.getAttribute('data-sit')); });
$('practiceBtn').onclick=()=>{ if(!$('practiceHome').hasChildNodes()) $('practiceHome').appendChild(makePracticePanel([])); $('practiceHome').scrollIntoView({behavior:'smooth'}); };
$('sitMic').onclick=()=>{
  if(!azureReady()){ alert('音声入力にはAzureの設定が必要です（設定でキーとリージョンを入力）。'); return; }
  $('sitMic').textContent='🔴 話してください...'; $('sitMic').disabled=true;
  recognizeJa(t=>{ $('sitMic').textContent='🎤 音声で入力'; $('sitMic').disabled=false;
    if(t){ $('situation').value=($('situation').value?$('situation').value+' ':'')+t; } });
};

// ---- 音声合成 ----
let ttsPlaying=false;
function unlockTTS(){ try{ const u=new SpeechSynthesisUtterance(''); speechSynthesis.speak(u); }catch(e){} }
function speak(text,onDone,rateOverride){
  let done=false; ttsPlaying=true;
  const finish=()=>{ if(done)return; done=true; ttsPlaying=false; if(onDone)onDone(); };
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=rateOverride||parseFloat($('rate').value)||0.95;
    const v=speechSynthesis.getVoices().find(v=>/en(-|_)US/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
    if(v) u.voice=v;
    u.onend=finish; u.onerror=finish;
    speechSynthesis.speak(u);
    setTimeout(finish, Math.max(1500, text.split(/\s+/).length*380/(u.rate||1))+800);
  }catch(e){ finish(); }
}

let mediaStream=null, mediaRecorder=null, chunks=[], recState='idle', discardNext=false, recTimer=null, recSecs=0;

function pickMime(){
  if(!window.MediaRecorder) return null;
  const cand=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac','audio/mpeg'];
  for(const m of cand){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return '';

async function ensureStream(){

}
function recDisplay(){ return '<span>🔴 録音中... '+recSecs+'秒</span><br><span class="ph">話し終わったら「⏹ 話し終わった（添削）」を押してください</span>'; }
function startTimer(){ stopTimer(); recTimer=setInterval(()=>{ recSecs++; if(recState==='recording') setLive(recDisplay(),true); },1000); }
function stopTimer(){ if(recTimer){ clearInterval(recTimer); recTimer=null; } }

async function startRecording(){

  chunks=[]; discardNext=false;

  try{ mediaRecorder=new MediaRecorder(mediaStream, mime?{mimeType:mime}:undefined); }
  catch(e){ mediaRecorder=new MediaRecorder(mediaStream); }

async function whisper(blob,type){

// ---- 録音音声を16kHzモノラルWAVへ変換（Azure採点用） ----
async function blobToWav(blob){
  const buf=await blob.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext;
  const ctx=new AC();
  const decoded=await ctx.decodeAudioData(buf.slice(0));
  try{ctx.close();}catch(e){}
  const rate=16000;
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const off=new OAC(1, Math.max(1,Math.round(decoded.duration*rate)), rate);
  const mono=off.createBuffer(1, decoded.length, decoded.sampleRate);
  const out=mono.getChannelData(0), ch=decoded.numberOfChannels;
  for(let i=0;i<decoded.length;i++){ let s=0; for(let c=0;c<ch;c++) s+=decoded.getChannelData(c)[i]; out[i]=s/ch; }
  const src=off.createBufferSource(); src.buffer=mono; src.connect(off.destination); src.start(0);
  const rendered=await off.startRendering();
  return encodeWav(rendered.getChannelData(0), rate);
}
function encodeWav(samples, rate){
  const view=new DataView(new ArrayBuffer(44+samples.length*2));
  const w=(o,s)=>{ for(let i=0;i<s.length;i++) view.setUint8(o+i,s.charCodeAt(i)); };
  w(0,'RIFF'); view.setUint32(4,36+samples.length*2,true); w(8,'WAVE'); w(12,'fmt ');
  view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,rate,true); view.setUint32(28,rate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true);
  w(36,'data'); view.setUint32(40,samples.length*2,true);
  let o=44; for(let i=0;i<samples.length;i++){ const s=Math.max(-1,Math.min(1,samples[i])); view.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2; }
  return new Blob([view],{type:'audio/wav'});
}

// ---- Azure 発音採点 ----
function azureReady(){ return $('azureKey').value.trim() && $('azureRegion').value.trim() && window.SpeechSDK; }
async function assessPronunciation(wavBlob, referenceText){
  if(!azureReady()) return null;
  const SDK=window.SpeechSDK;
  const speechConfig=SDK.SpeechConfig.fromSubscription($('azureKey').value.trim(), $('azureRegion').value.trim());
  speechConfig.speechRecognitionLanguage='en-US';
  const audioConfig=SDK.AudioConfig.fromWavFileInput(new File([wavBlob],'a.wav',{type:'audio/wav'}));
  const pa=new SDK.PronunciationAssessmentConfig(referenceText||'', SDK.PronunciationAssessmentGradingSystem.HundredMark, SDK.PronunciationAssessmentGranularity.Phoneme, true);
  try{ pa.enableProsodyAssessment=true; }catch(e){}
  const reco=new SDK.SpeechRecognizer(speechConfig, audioConfig);
  pa.applyTo(reco);
  return new Promise(resolve=>{
    reco.recognizeOnceAsync(result=>{
      let out=null;
      try{
        const r=SDK.PronunciationAssessmentResult.fromResult(result);
        let words=[];
        try{ words=(r.detailResult.Words||[]).map(x=>({w:x.Word, acc:x.PronunciationAssessment&&x.PronunciationAssessment.AccuracyScore, err:x.PronunciationAssessment&&x.PronunciationAssessment.ErrorType})); }catch(e){}
        out={ accuracy:r.accuracyScore, fluency:r.fluencyScore, completeness:r.completenessScore, pron:r.pronunciationScore, prosody:r.prosodyScore, words };
      }catch(e){}
      try{reco.close();}catch(e){}
      resolve(out);
    }, ()=>{ try{reco.close();}catch(e){} resolve(null); });
  });
}

// ---- Azure リアルタイム認識（話しながら文字が出る＋発音採点＋自分の声を録音） ----
let azureReco=null, azureText='', azurePAsegs=[];
let audioCtx=null, audioProc=null, audioSrc=null, azurePush=null;
let pbRecorder=null, pbChunks=[], lastAudioUrl=null;
function aggregatePA(segs){
  if(!segs||!segs.length) return null;
  const avg=k=>{ const xs=segs.map(s=>s[k]).filter(v=>v!=null&&!isNaN(v)); return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null; };
  const words=[].concat.apply([],segs.map(s=>s.words||[]));
  return { accuracy:avg('accuracy'), fluency:avg('fluency'), prosody:avg('prosody'), completeness:avg('completeness'), pron:avg('pron'), words };
}
function downsampleTo16k(input,inRate){
  if(inRate===16000) return input;
  const ratio=inRate/16000, outLen=Math.floor(input.length/ratio), out=new Float32Array(outLen);
  for(let i=0;i<outLen;i++) out[i]=input[Math.floor(i*ratio)];
  return out;
}
function floatTo16(f){ const b=new Int16Array(f.length); for(let i=0;i<f.length;i++){ const s=Math.max(-1,Math.min(1,f[i])); b[i]=s<0?s*0x8000:s*0x7FFF; } return b; }
// 音声グラフは毎回クリーンに作り直す（持ち越さない）
function resetAudioGraph(){
  try{ if(audioProc){ audioProc.onaudioprocess=null; audioProc.disconnect(); } }catch(e){} audioProc=null;
  try{ if(audioSrc) audioSrc.disconnect(); }catch(e){} audioSrc=null;
  try{ if(azurePush) azurePush.close(); }catch(e){} azurePush=null;
  try{ if(audioCtx) audioCtx.close(); }catch(e){} audioCtx=null;
}
async function startAzureLive(){
  const SDK=window.SpeechSDK;
  let stream;
  try{ stream=await ensureStream(); }
  catch(e){ setLive('<span class="ph">🎤 マイクを使用できません: '+escapeHtml(e.message)+'</span>'); return; }
  let cfg;
  try{ cfg=SDK.SpeechConfig.fromSubscription($('azureKey').value.trim(), $('azureRegion').value.trim()); }
  catch(e){ setLive('<span class="ph">Azure設定エラー: '+escapeHtml(e.message)+'</span>'); return; }
  cfg.speechRecognitionLanguage='en-US';
  // 1本のマイク音声を、Azure(認識)と録音(再生用)で共有する
  resetAudioGraph();                    // 前回分を確実に掃除してから作り直す
  const fmt=SDK.AudioStreamFormat.getWaveFormatPCM(16000,16,1);
  azurePush=SDK.AudioInputStream.createPushStream(fmt);
  const audioConfig=SDK.AudioConfig.fromStreamInput(azurePush);
  const AC=window.AudioContext||window.webkitAudioContext;
  audioCtx=new AC();
  try{ await audioCtx.resume(); }catch(e){}   // 再生後に suspended でも確実に起動
  audioSrc=audioCtx.createMediaStreamSource(stream);
  audioProc=audioCtx.createScriptProcessor(4096,1,1);
  const mute=audioCtx.createGain(); mute.gain.value=0;
  audioSrc.connect(audioProc); audioProc.connect(mute); mute.connect(audioCtx.destination);
  const inRate=audioCtx.sampleRate;
  audioProc.onaudioprocess=e=>{ if(!azurePush) return; try{ azurePush.write(floatTo16(downsampleTo16k(e.inputBuffer.getChannelData(0),inRate)).buffer); }catch(_){} };
  // 再生用の録音
  lastAudioUrl=null;
  try{ pbChunks=[]; const m=pickMime(); pbRecorder=new MediaRecorder(stream, m?{mimeType:m}:undefined);
    pbRecorder.ondataavailable=ev=>{ if(ev.data&&ev.data.size) pbChunks.push(ev.data); }; pbRecorder.start(); }
  catch(e){ pbRecorder=null; }
  const pa=new SDK.PronunciationAssessmentConfig('', SDK.PronunciationAssessmentGradingSystem.HundredMark, SDK.PronunciationAssessmentGranularity.Phoneme, false);
  try{ pa.enableProsodyAssessment=true; }catch(e){}
  azureReco=new SDK.SpeechRecognizer(cfg, audioConfig);
  pa.applyTo(azureReco);
  try{ const pl=phraseList(); if(pl.length){ const g=SDK.PhraseListGrammar.fromRecognizer(azureReco); pl.forEach(p=>g.addPhrase(p)); } }catch(e){}
  azureText=''; azurePAsegs=[];
  azureReco.recognizing=(s,e)=>{ const t=(azureText+' '+e.result.text).trim(); setLive(t?escapeHtml(t):'<span class="ph">🔴 聞いています...</span>', true); };
  azureReco.recognized=(s,e)=>{
    if(e.result.reason===SDK.ResultReason.RecognizedSpeech && e.result.text){
      azureText=(azureText+' '+e.result.text).trim();
      try{ const r=SDK.PronunciationAssessmentResult.fromResult(e.result);
        let words=[]; try{ words=(r.detailResult.Words||[]).map(x=>({w:x.Word, acc:x.PronunciationAssessment&&x.PronunciationAssessment.AccuracyScore, err:x.PronunciationAssessment&&x.PronunciationAssessment.ErrorType})); }catch(_){}
        azurePAsegs.push({accuracy:r.accuracyScore,fluency:r.fluencyScore,prosody:r.prosodyScore,completeness:r.completenessScore,pron:r.pronunciationScore,words});
      }catch(_){}
      setLive(escapeHtml(azureText), true);
    }
  };
  azureReco.canceled=(s,e)=>{ setLive('<span class="ph">🎤 認識エラー: '+escapeHtml(e.errorDetails||e.reason)+'</span>'); };
  recState='recording'; $('micBtn').classList.add('rec'); $('micBtn').textContent='⏹ 話し終わった（添削）';
  setLive('<span class="ph">🔴 聞いています... 話し終わったら「⏹」を押してください</span>', true);
  azureReco.startContinuousRecognitionAsync(()=>{}, err=>{ setLive('<span class="ph">開始エラー: '+escapeHtml(err)+'</span>'); recState='idle'; $('micBtn').classList.remove('rec'); $('micBtn').textContent='🎤 話す'; });
}
function stopAzureLive(discard){
  if(!azureReco){ recState='idle'; return; }
  recState='transcribing';
  resetAudioGraph();   // 音声グラフを掃除（pushを閉じてAzureに終端を伝える）
  if(pbRecorder){
    pbRecorder.onstop=()=>{ if(!discard && pbChunks.length){ try{ lastAudioUrl=URL.createObjectURL(new Blob(pbChunks,{type:(pbRecorder&&pbRecorder.mimeType)||'audio/webm'})); }catch(e){} } };
    try{ pbRecorder.stop(); }catch(e){} pbRecorder=null;
  }
  if(!discard){ $('micBtn').classList.remove('rec'); setLive('<span class="loading"><span class="spinner"></span>✍️ まとめています...</span>'); }
  const reco=azureReco; azureReco=null;
  reco.stopContinuousRecognitionAsync(()=>{
    try{reco.close();}catch(e){}
    if(discard){ recState='idle'; startAzureLive(); return; }
    recState='idle'; $('micBtn').textContent='🎤 話す';
    const text=azureText.trim();
    if(!text){ setLive('<span class="ph">聞き取れませんでした。「🎤 話す」でもう一度どうぞ。</span>'); return; }
    submitAnswer(text, aggregatePA(azurePAsegs), lastAudioUrl);
  }, ()=>{ recState='idle'; $('micBtn').textContent='🎤 話す'; setLive('<span class="ph">停止エラー。もう一度お試しください。</span>'); });
}

// ネットワーク一時失敗に強くする（数回リトライ）
async function fetchRetry(url,opts,tries){
  tries=tries||3; let last;
  for(let i=0;i<tries;i++){
    try{ return await fetch(url,opts); }
    catch(e){ last=e; await new Promise(r=>setTimeout(r,700*(i+1))); }
  }
  throw last;
}

      '</span></div>'+
    '<div class="listen">🎧 音声を聞いて、英語で答えてみましょう</div>'+
    '<div class="en hidden">'+escapeHtml(obj.partner_line)+'</div>'+
    '<div class="ja hidden">'+escapeHtml(obj.partner_line_ja||'')+'</div>';
  const enEl=d.querySelector('.en'), jaEl=d.querySelector('.ja'), lis=d.querySelector('.listen');
  const sync=()=>{ lis.style.display=(enEl.classList.contains('hidden')&&jaEl.classList.contains('hidden'))?'':'none'; };
  d.querySelector('.rep').onclick=()=>speak(obj.partner_line);
  d.querySelector('.slow').onclick=()=>speak(obj.partner_line,null,0.55);
  d.querySelector('.tEn').onclick=e=>{ enEl.classList.toggle('hidden'); e.currentTarget.classList.toggle('on'); sync(); };
  d.querySelector('.tJa').onclick=e=>{ jaEl.classList.toggle('hidden'); e.currentTarget.classList.toggle('on'); sync(); };
  $('convo').appendChild(d);
  speak(obj.partner_line,onSpoken);
}
function renderUser(text, audioUrl){
  const d=document.createElement('div'); d.className='msg user';
  const play=audioUrl?'<button class="speak playme">▶️ 自分の声</button>':'';
  d.innerHTML='<div class="who"><span>🗣 あなた</span>'+play+'</div><div class="en">'+escapeHtml(text)+'</div>';
  if(audioUrl){ const au=new Audio(audioUrl); d.querySelector('.playme').onclick=()=>{ try{au.currentTime=0;}catch(e){} au.play(); }; }
  $('convo').appendChild(d);
}
function renderFeedback(fb){
  if(!fb) return;
  const comp=(fb.comprehensible&&typeof fb.comprehensible==='object')?fb.comprehensible:{note:fb.comprehensible};
  const lv=comp.level||'mid';
  const badge=lv==='ok'?'<span class="badge ok">通じる</span>':lv==='no'?'<span class="badge no">通じにくい</span>':'<span class="badge mid">惜しい</span>';
  const nat=(fb.native&&typeof fb.native==='object')?fb.native:{en:fb.native};
  const dash='<span class="ph">—</span>';
  const d=document.createElement('div'); d.className='fb';
  d.innerHTML='<h4>📝 添削</h4>'+
    '<div class="item"><span class="k">① 通じたか</span>'+badge+'<div>'+(escapeHtml(comp.note)||dash)+'</div></div>'+
    '<div class="item"><span class="k">② 文法</span><div>'+(escapeHtml(fb.grammar)||dash)+'</div></div>'+
    '<div class="item"><span class="k">③ 発音</span><div>'+(escapeHtml(fb.pronunciation)||dash)+'</div></div>'+
    '<div class="item native"><span class="k">④ より自然な言い方</span><div class="en">'+(escapeHtml(nat.en)||dash)+' <button class="speak">🔊</button></div><div class="ja">'+escapeHtml(nat.ja||'')+'</div></div>';
  d.querySelector('.speak').onclick=()=>speak(nat.en||'');
  $('convo').appendChild(d);
}
function scoreColor(v){ if(v==null) return 'var(--muted)'; return v>=80?'#0c7a54':v>=60?'#a9721a':'#c23a1f'; }
function renderPronScore(pa){
  if(!pa) return;
  const rows=[['総合',pa.pron],['正確さ',pa.accuracy],['流暢さ',pa.fluency],['抑揚',pa.prosody],['完全性',pa.completeness]]
    .filter(r=>r[1]!=null);
  let bars=rows.map(r=>{
    const v=Math.round(r[1]);
    return '<div class="scrow"><span class="scl">'+r[0]+'</span>'+
      '<span class="scbar"><span class="scfill" style="width:'+v+'%;background:'+scoreColor(v)+'"></span></span>'+
      '<span class="scv" style="color:'+scoreColor(v)+'">'+v+'</span></div>';
  }).join('');
  let weak=(pa.words||[]).filter(w=>w.err&&w.err!=='None'||(w.acc!=null&&w.acc<70));
  weak.forEach(w=>{ if(w.w && !sessionWeakWords.includes(w.w)) sessionWeakWords.push(w.w); });
  let weakHtml='';
  if(weak.length){
    weakHtml='<div class="weak"><b>要練習の単語:</b> '+weak.map(w=>{
      const lab=w.err&&w.err!=='None'?w.err:'';
      return '<span class="wchip">'+escapeHtml(w.w)+(w.acc!=null?' '+Math.round(w.acc):'')+'</span>';
    }).join(' ')+'</div>';
  } else if((pa.words||[]).length){
    weakHtml='<div class="weak" style="color:#0c7a54">🌟 全単語しっかり発音できています！</div>';
  }
  const d=document.createElement('div'); d.className='fb pron';
  d.innerHTML='<h4>🎯 発音スコア（Azure実測）</h4>'+bars+weakHtml;
  $('convo').appendChild(d);
}
function escapeHtml(s){ if(s==null) return ''; if(typeof s!=='string') s=(typeof s==='object')?JSON.stringify(s):String(s);
  return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function scrollDown(){ window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); }

// ---- 会話開始 ----
$('startBtn').onclick=()=>startConversation($('situation').value.trim());
async function startConversation(sit){
  if(!sit){ alert('場面を選ぶか、自由入力してください。'); return; }
  unlockTTS();
  $('startBtn').disabled=true;
  messages=[{role:'user',content:'練習したい場面: '+sit+'\n\nこの場面の相手役として、あなたから会話を始めてください。feedbackは省略で。'}];
  const load=loadingEl('相手が準備中...'); $('convo').appendChild(load);
  try{
    const obj=await callClaude();
    messages.push({role:'assistant',content:JSON.stringify(obj)});
    load.remove();
    $('setupCard').classList.add('hidden'); hideManualBox();
    setDirection(obj.direction_ja||'英語で返答してください');
    $('inputCard').classList.remove('hidden');
    setLive('<span class="ph">相手が話しています...</span>');
    renderPartner(obj,readyForUser);
    scrollDown();
  }catch(e){ load.remove(); showError(e); $('startBtn').disabled=false; }
};

// ---- 添削 ----
async function submitAnswer(ans, pa, audioUrl){
  ans=(ans||'').trim();
  if(!ans){ alert('英語で話すか入力してください。'); return; }
  renderUser(ans, audioUrl); hideManualBox();
  if(pa) renderPronScore(pa);
  $('inputCard').classList.add('hidden');
  messages.push({role:'user',content:'私の英語の返答（Whisperで文字起こし）: "'+ans+'"\n\nこの返答をfeedbackで4観点添削し、会話を続けてください。'+(keepGoing?' ユーザーはまだ会話を続けたいので、doneはfalseのまま自然に会話を継続してください。':'')});
  const load=loadingEl('添削中...'); $('convo').appendChild(load); scrollDown();
  try{
    const obj=await callClaude();
    messages.push({role:'assistant',content:JSON.stringify(obj)});
    let fb=obj.feedback;
    if(!fbHasContent(fb)){ try{ fb=await repairFeedback(ans); }catch(e){} }
    load.remove();
    renderFeedback(fb);
    if(obj.done){
      renderPartner(obj);
      $('inputCard').classList.add('hidden');
      const d=document.createElement('div'); d.className='card sys';
      d.innerHTML='<b>🎉 ひと区切りです！</b><br><span style="font-size:13px;color:var(--muted)">会話を続けますか？終わりにしますか？</span>';
      const row=document.createElement('div'); row.className='row'; row.style.marginTop='12px';
      const cont=document.createElement('button'); cont.className='btn-primary'; cont.style.flex='1'; cont.textContent='▶ 続ける';
      cont.onclick=()=>{ keepGoing=true; d.remove(); $('inputCard').classList.remove('hidden'); readyForUser(); scrollDown(); };
      const quit=document.createElement('button'); quit.className='btn-ghost'; quit.style.flex='1'; quit.textContent='■ やめる';
      quit.onclick=()=>{ d.remove(); endWithSummary(); };
      const c1=document.createElement('div'); c1.style.flex='1'; c1.appendChild(cont);
      const c2=document.createElement('div'); c2.style.flex='1'; c2.appendChild(quit);
      row.appendChild(c1); row.appendChild(c2); d.appendChild(row);
      $('convo').appendChild(d);
    }else{
      setDirection(obj.direction_ja||'英語で返答してください');
      $('inputCard').classList.remove('hidden');
      setLive('<span class="ph">相手が話しています...</span>');
      renderPartner(obj,readyForUser);
    }
    scrollDown();
  }catch(e){ load.remove(); showError(e); $('inputCard').classList.remove('hidden'); }
}
$('sendBtn').onclick=()=>submitAnswer($('answer').value);

function releaseMic(){ resetAudioGraph(); try{ if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; } }catch(e){} }
$('endBtn').onclick=()=>endWithSummary();

// 会話の録音を止める（Azure/録音どちらでも）
function stopAllCapture(){
  if(azureReco){ try{ const r=azureReco; azureReco=null; r.stopContinuousRecognitionAsync(()=>{try{r.close();}catch(e){}}, ()=>{}); }catch(e){} }
  if(mediaRecorder && recState==='recording'){ discardNext=true; try{mediaRecorder.stop();}catch(e){} }
  recState='idle'; releaseMic();
}
// 振り返りをまとめる用ツール
const SUMMARY_TOOL={ name:'session_summary', description:'英会話練習セッション全体の振り返り',
  input_schema:{ type:'object', properties:{
    good:{type:'string',description:'今回よくできていた点（日本語・励まし）'},
    points:{type:'array',description:'特に改善すべき点3〜5個',
      items:{type:'object',properties:{title:{type:'string',description:'短い見出し'},detail:{type:'string',description:'具体的な説明と直し方（日本語）'}},required:['title','detail']}},
    encouragement:{type:'string',description:'次回への一言（日本語）'}
  }, required:['good','points','encouragement'] } };
async function summarize(){
  const key=$('apiKey').value.trim();
  const msgs=messages.concat([{role:'user',content:'ここで練習を終えます。この会話全体を振り返って、私（日本人の英語学習者）の発話について、特に改善すべき点を3〜5個、日本語で具体的にまとめてください。文法・語彙・自然さ・発音の観点から。良かった点と次回への励ましも添えて、session_summaryツールで返してください。'}]);
  const res=await fetchRetry('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({ model:$('model').value, max_tokens:1000, messages:msgs, tools:[SUMMARY_TOOL], tool_choice:{type:'tool',name:'session_summary'} })
  });
  if(!res.ok) throw new Error('summary '+res.status);
  const data=await res.json();
  const tu=(data.content||[]).find(c=>c.type==='tool_use');
  if(tu&&tu.input) return tu.input;
  throw new Error('no summary');
}
async function endWithSummary(){
  stopAllCapture();
  $('inputCard').classList.add('hidden');
  let sum=null;
  if(messages.length>1){
    const load=loadingEl('今回の振り返りを作成中...'); $('convo').appendChild(load); scrollDown();
    try{ sum=await summarize(); }catch(e){}
    load.remove();
  }
  renderSummary(sum);
}
// ---- 単語の発音練習ドリル ----
let drillRec=null, drillChunks=[], drillState='idle';
function makeDrill(word){
  const box=document.createElement('div'); box.className='drill';
  box.innerHTML='<div class="dw">'+escapeHtml(word)+'</div>'+
    '<div class="drow"><button class="btn-ghost btn-sm dmodel">🔊 お手本</button>'+
    '<button class="btn-mic btn-sm drec">🎤 録音して発音</button></div>'+
    '<div class="dresult"></div>';
  const res=box.querySelector('.dresult'), recBtn=box.querySelector('.drec');
  box.querySelector('.dmodel').onclick=()=>speak(word,null,0.7);
  recBtn.onclick=async()=>{
    if(drillState==='recording'){ drillState='processing'; recBtn.textContent='⏳ 採点中...'; try{drillRec.stop();}catch(e){} return; }
    if(drillState!=='idle') return;
    if(!azureReady()){ res.innerHTML='<span class="ph">発音採点にはAzureの設定が必要です。</span>'; return; }
    let stream; try{ stream=await ensureStream(); }catch(e){ res.textContent='マイクを使用できません'; return; }
    drillChunks=[]; const m=pickMime();
    try{ drillRec=new MediaRecorder(stream, m?{mimeType:m}:undefined); }catch(e){ drillRec=new MediaRecorder(stream); }
    drillRec.ondataavailable=ev=>{ if(ev.data&&ev.data.size) drillChunks.push(ev.data); };
    drillRec.onstop=async()=>{
      const blob=new Blob(drillChunks,{type:(drillRec&&drillRec.mimeType)||'audio/webm'});
      let url=null; try{url=URL.createObjectURL(blob);}catch(e){}
      let pa=null; try{ pa=await assessPronunciation(await blobToWav(blob), word); }catch(e){}
      drillState='idle'; recBtn.textContent='🎤 もう一度';
      renderDrillResult(res, word, pa, url);
    };
    drillRec.start(); drillState='recording'; recBtn.textContent='⏹ 停止';
    res.innerHTML='<span class="ph">🔴 「'+escapeHtml(word)+'」と発音してください… 終わったら「⏹ 停止」</span>';
  };
  return box;
}
function renderDrillResult(res, word, pa, url){
  let acc=pa?pa.accuracy:null;
  if(pa&&pa.words&&pa.words.length){ const w=pa.words.find(x=>x.w&&x.w.toLowerCase()===word.toLowerCase())||pa.words[0]; if(w&&w.acc!=null) acc=w.acc; }
  const v=acc!=null?Math.round(acc):null, col=scoreColor(v);
  let html='';
  if(v!=null){
    html+='<div class="drow"><span class="scv" style="flex:0 0 auto;color:'+col+'">'+v+'点</span>'+
      '<span class="scbar" style="flex:1"><span class="scfill" style="width:'+v+'%;background:'+col+'"></span></span></div>';
  }else{
    html+='<div class="ph" style="margin-bottom:6px">うまく採点できませんでした。もう一度どうぞ。</div>';
  }
  html+='<div class="drow" style="margin-top:6px">'+
    (url?'<button class="btn-ghost btn-sm dplay">▶️ 自分の声</button>':'')+
    '<button class="btn-ghost btn-sm dmodel2">🔊 お手本</button></div>';
  res.innerHTML=html;
  if(url){ const a=new Audio(url); res.querySelector('.dplay').onclick=()=>{try{a.currentTime=0;}catch(e){} a.play();}; }
  res.querySelector('.dmodel2').onclick=()=>speak(word,null,0.7);
}
function makePracticePanel(weakWords){
  const card=document.createElement('div'); card.className='card sys';
  let html='<h3 style="margin:0 0 6px;color:var(--coral2)">🗣 単語の発音練習</h3>'+
    '<div class="hint" style="margin-top:0">練習したい単語を入力するか、候補をタップ。録音すると発音を採点します。</div>'+
    '<div class="row" style="margin-top:10px"><div style="flex:1"><input type="text" class="pw" placeholder="例: big, beach, thank"></div>'+
    '<div style="flex:0 0 auto"><button class="btn-primary btn-sm padd">追加</button></div></div>';
  if(weakWords&&weakWords.length){
    html+='<div style="margin-top:10px"><b style="font-size:13px">今回の弱点（タップで練習）:</b><br>'+
      weakWords.map(w=>'<span class="wchip pick" data-w="'+escapeHtml(w)+'">'+escapeHtml(w)+'</span>').join(' ')+'</div>';
  }
  html+='<div class="drills" style="margin-top:12px"></div>';
  card.innerHTML=html;
  const drills=card.querySelector('.drills'), input=card.querySelector('.pw');
  const add=w=>{ w=(w||'').trim(); if(w) drills.prepend(makeDrill(w)); };
  card.querySelector('.padd').onclick=()=>{ add(input.value); input.value=''; };
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); add(input.value); input.value=''; } });
  card.querySelectorAll('.pick').forEach(ch=>ch.onclick=()=>add(ch.getAttribute('data-w')));
  return card;
}
// ---- 日本語の音声入力（シチュエーション用） ----
function recognizeJa(cb){
  if(!azureReady()){ cb(null); return; }
  const SDK=window.SpeechSDK;
  let r;
  try{ const cfg=SDK.SpeechConfig.fromSubscription($('azureKey').value.trim(),$('azureRegion').value.trim()); cfg.speechRecognitionLanguage='ja-JP';
    r=new SDK.SpeechRecognizer(cfg, SDK.AudioConfig.fromDefaultMicrophoneInput()); }
  catch(e){ cb(''); return; }
  r.recognizeOnceAsync(res=>{ cb(res&&res.reason===SDK.ResultReason.RecognizedSpeech?res.text:''); try{r.close();}catch(e){} },
    ()=>{ cb(''); try{r.close();}catch(e){} });
}

function renderSummary(sum){
  const d=document.createElement('div'); d.className='card sys';
  let html='<h3 style="margin:0 0 10px;color:var(--sea2)">📊 今回の振り返り</h3>';
  if(sum){
    if(sum.good) html+='<div class="good-note">👍 '+escapeHtml(sum.good)+'</div>';
    html+='<div class="k" style="margin-top:12px">改善ポイント</div><ol class="sumlist">';
    (sum.points||[]).forEach(p=>{ html+='<li><b>'+escapeHtml(p.title)+'</b><br><span style="color:var(--muted);font-size:14px">'+escapeHtml(p.detail)+'</span></li>'; });
    html+='</ol>';
  }else{
    html+='<div style="color:var(--muted);font-size:14px">お疲れさまでした。今回の練習を終えました。</div>';
  }
  if(sessionWeakWords.length){
    html+='<div class="k" style="margin-top:12px">🎯 発音で気をつけたい単語</div><div style="margin-top:4px">'+
      sessionWeakWords.map(w=>'<span class="wchip">'+escapeHtml(w)+'</span>').join(' ')+'</div>';
  }
  if(sum&&sum.encouragement) html+='<div style="margin-top:12px">🌺 '+escapeHtml(sum.encouragement)+'</div>';
  d.innerHTML=html;
  const btn=document.createElement('button'); btn.className='btn-primary'; btn.style.marginTop='16px'; btn.style.width='100%';
  btn.textContent='🏠 最初の画面に戻る';
  btn.onclick=()=>location.reload();
  d.appendChild(btn);
  $('convo').appendChild(d);
  $('convo').appendChild(makePracticePanel(sessionWeakWords));
  scrollDown();
}
function showError(e){
  const msg=e&&e.message||'';
  const net=/load failed|failed to fetch|networkerror|network error/i.test(msg);
  const lowbal=/credit balance is too low|insufficient/i.test(msg);
  const d=document.createElement('div'); d.className='card'; d.style.borderColor='#f2a596';
  let note;
  if(net) note='📶 ネットワークに接続できませんでした（残高不足ではありません）。電波を確認して、もう一度お試しください。';
  else if(lowbal) note='💳 Claudeのクレジット残高が不足しています。console.anthropic.com でチャージしてください。';
  else note='APIキー・残高・ネット接続を確認してください。';
  d.innerHTML='<b style="color:#c23a1f">⚠️ エラー</b><br><span style="font-size:13px">'+escapeHtml(msg)+'</span>'+
    '<div class="hint">'+note+'</div>';
  $('convo').appendChild(d); scrollDown();
}
